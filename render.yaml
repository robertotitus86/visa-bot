services:
  - type: web
    name: visa-global-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: VERIFY_TOKEN
        value: visaglobal2026
      - key: WA_TOKEN
        value: PENDIENTE_TOKEN_META
      - key: PHONE_NUMBER
        value: "593994442512"
