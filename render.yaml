services:
  - type: worker
    name: recordatorios-castro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python recordatorios_castro.py

  - type: web
    name: visa-global-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: VERIFY_TOKEN
        value: visaglobal2026
      - key: WA_TOKEN
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: PHONE_NUMBER
        value: "593994442512"
      # ── REQUERIDOS para seguridad — configurar en Render Dashboard ──
      - key: FOLLOWUP_SECRET
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: ADMIN_PANEL_SECRET
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: META_APP_SECRET
        value: CONFIGURAR_EN_RENDER_DASHBOARD
      - key: GEMINI_API_KEY
        value: CONFIGURAR_EN_RENDER_DASHBOARD
